name: QA regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Quality gates and Chromium regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run API tests
        run: npm run test:api
        env:
          CI: 'true'
          REPORT_NAME: api

      - name: Run UI tests
        run: npm run test:ui
        env:
          CI: 'true'
          REPORT_NAME: ui-chromium

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: 'true'
          REPORT_NAME: integration

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-regression-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  cross-browser:
    name: Cross-browser UI (${{ matrix.browser }})
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run UI suite
        run: npm run test:ui:${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.browser }}-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
